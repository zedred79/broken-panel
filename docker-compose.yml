services:
  broken-panel:
    # build: usato solo da `docker compose build` (per pubblicare una nuova
    # versione su Docker Hub). Sul server di produzione non serve: basta
    # `docker compose pull && docker compose up -d`, senza portarci sopra i
    # sorgenti né i tool di compilazione (vedi README).
    build: .
    image: zedred/broken-panel:latest
    container_name: broken-panel
    restart: unless-stopped
    ports:
      # Host:Container - porta host insolita per evitare conflitti con gli altri
      # servizi sul server. Cambiala in .env con HOST_PORT=xxxxx se serve.
      - "${HOST_PORT:-48217}:3000"
    environment:
      DATABASE_URL: "file:/data/app.db"
      UPLOADS_DIR: "/app/uploads"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "${NEXTAUTH_URL}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      SITE_HERO_TITLE: "${SITE_HERO_TITLE}"
      SITE_HERO_SUBTITLE: "${SITE_HERO_SUBTITLE}"
      SITE_FOOTER_TEXT: "${SITE_FOOTER_TEXT}"
    volumes:
      # Cartelle mappate sull'host invece di volumi Docker nominati: puoi
      # ispezionare/backuppare ./data direttamente, senza passare da un
      # container temporaneo. Il container gira come utente non-root
      # (uid 1001, vedi Dockerfile) — la PRIMA volta va dato a queste
      # cartelle il proprietario giusto, altrimenti l'app non riesce a
      # scriverci (DB e upload falliscono in silenzio):
      #   mkdir -p data/db data/uploads && sudo chown -R 1001:1001 data
      - ./data/db:/data
      - ./data/uploads:/app/uploads
    networks:
      - default
      - swag_net

networks:
  default: {}
  swag_net:
    # Rete esterna condivisa con il container SWAG, per il proxy interno
    # senza passare dalla porta esposta sull'host.
    # Verifica il nome reale con: docker network ls
    external: true
    name: ${SWAG_NETWORK_NAME:-swag_default}
